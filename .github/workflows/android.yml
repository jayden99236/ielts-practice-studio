name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bundle the site and offline speech model
        run: bash android/fetch-assets.sh android/app/src/main/assets/www

      - name: Set up Gradle wrapper
        run: |
          mkdir /tmp/wrap && cd /tmp/wrap && touch settings.gradle
          gradle wrapper --gradle-version 8.9 --no-daemon
          cp -r gradlew gradle "$GITHUB_WORKSPACE/android/"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ielts.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ielts.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ielts-practice-studio.apk
          ls -lh ielts-practice-studio.apk
          unzip -l ielts-practice-studio.apk | grep -E "assets/www"
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" ielts-practice-studio.apk --title "Android app build ${{ github.run_number }}" \
            --notes "Offline Android app. Download the APK below and open it on your phone to install." --latest
