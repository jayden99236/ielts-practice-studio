plugins {
    id "com.android.application"
}

android {
    namespace "io.github.jayden99236.ielts"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.jayden99236.ielts"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        // A fixed key (supplied by CI) lets new versions install over old ones.
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "ielts"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }

    // The model and WebAssembly files are already compressed formats; store them as-is so they load fast.
    androidResources {
        noCompress += ["onnx", "wasm"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
